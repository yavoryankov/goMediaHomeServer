name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android

  ios:
    name: iOS
    # The project uses the Xcode 27 project format (project.xcproj).
    # macos-latest currently defaults to Xcode 26.6 and expects project.pbxproj.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator target
        run: >-
          xcodebuild
          -project "ios/goMediaHomеClient/goMediaHomеClient.xcodeproj"
          -scheme "goMediaHomеClient"
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/goMediaHomeServer-ios-derived"
          CODE_SIGNING_ALLOWED=NO build

  chrome-extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile chrome-extension/vimeo-downloader-v2/bridge.py
      - run: python -m json.tool chrome-extension/vimeo-downloader-v2/manifest.json >/dev/null
